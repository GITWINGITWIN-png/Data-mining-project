# Presentation settings for the submitted dashboard.
[server]
headless = true

[browser]
gatherUsageStats = false

[client]
# Hides the Deploy button and the running-man toolbar. They belong to the
# Streamlit product, not to this project, and they sit in the top-right of
# every screenshot that goes into the report.
toolbarMode = "minimal"

[theme]
base = "light"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f5f1"
primaryColor = "#2a78d6"
textColor = "#0b0b0b"
